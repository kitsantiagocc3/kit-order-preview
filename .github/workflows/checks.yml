name: Checks

# Runs the order-preview checks on every push to main, every pull request,
# and on demand (Actions tab → Checks → Run workflow).
# It only tests code. It deploys nothing and needs no secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-server:
    name: Check local Node server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: node --check server.cjs
      - name: Run preview, route and page safety checks
        run: node --test tests/server.test.cjs

  azure-candidate:
    name: Check Azure Functions candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: azure-candidate/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: azure-candidate/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the shared preview cases
        run: python -m unittest discover -s tests -v
